name: Shuffle recovery experimental

on:
  pull_request:
    branches:
      - spip/shuffle-recovery-experimental
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuffle-recovery-experimental-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select focused recovery boundary
    runs-on: ubuntu-latest
    outputs:
      source_identity: ${{ steps.scope.outputs.source_identity }}
      core_identity: ${{ steps.scope.outputs.core_identity }}
      canonical_sql_identity: ${{ steps.scope.outputs.canonical_sql_identity }}
      attempt_lifecycle: ${{ steps.scope.outputs.attempt_lifecycle }}
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed recovery boundary
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          source_identity=false
          core_identity=false
          canonical_sql_identity=false
          attempt_lifecycle=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            source_identity=true
            core_identity=true
            canonical_sql_identity=true
            attempt_lifecycle=true
          else
            git fetch --no-tags origin \
              spip/shuffle-recovery-experimental:refs/remotes/origin/spip/shuffle-recovery-experimental
            base="$(git merge-base HEAD origin/spip/shuffle-recovery-experimental)"
            while IFS= read -r path; do
              case "${path}" in
                .github/workflows/shuffle-recovery-phase0.yml)
                  ;;
                core/src/main/scala/org/apache/spark/shuffle/ShuffleRecoveryAttemptContext.scala|\
                core/src/main/scala/org/apache/spark/shuffle/ReferenceShuffleRecoveryClaimProvider.scala|\
                core/src/main/scala/org/apache/spark/shuffle/ShuffleRecoveryClaim.scala|\
                core/src/main/scala/org/apache/spark/shuffle/ShuffleRecoveryIndexShuffleBlockResolver.scala|\
                core/src/main/scala/org/apache/spark/shuffle/ShuffleRecoveryPreparation.scala|\
                core/src/main/scala/org/apache/spark/shuffle/ShuffleRecoveryUntrustedBoundary.scala|\
                core/src/main/scala/org/apache/spark/ShuffleRecoverySchedulerAdoption.scala|\
                core/src/test/scala/org/apache/spark/shuffle/ShuffleRecoveryAttemptContext*.scala)
                  attempt_lifecycle=true
                  ;;
                core/src/main/scala/org/apache/spark/shuffle/ShuffleRecoveryComputationIdentity.scala|\
                core/src/test/scala/org/apache/spark/shuffle/ShuffleRecoveryComputationIdentity*.scala)
                  core_identity=true
                  ;;
                sql/core/src/main/scala/org/apache/spark/sql/execution/exchange/ShuffleRecoverySourceReadIdentity.scala|\
                sql/core/src/test/scala/org/apache/spark/sql/execution/exchange/ShuffleRecoverySourceReadIdentity*.scala)
                  source_identity=true
                  ;;
                sql/core/src/main/scala/org/apache/spark/sql/execution/exchange/ShuffleRecoveryComputationIdentityBuilder.scala|\
                sql/core/src/test/scala/org/apache/spark/sql/execution/exchange/ShuffleRecoveryComputationIdentityBuilderSuite.scala|\
                sql/core/src/test/scala/org/apache/spark/sql/execution/exchange/ShuffleRecoveryOpportunityAnalyzerSuite.scala)
                  canonical_sql_identity=true
                  ;;
                core/src/main/scala/org/apache/spark/shuffle/ShuffleRecovery*.scala|\
                core/src/test/scala/org/apache/spark/shuffle/ShuffleRecovery*.scala|\
                core/src/main/scala/org/apache/spark/ShuffleRecovery*.scala|\
                core/src/test/scala/org/apache/spark/ShuffleRecovery*.scala)
                  attempt_lifecycle=true
                  core_identity=true
                  ;;
                sql/core/src/main/scala/org/apache/spark/sql/execution/exchange/ShuffleRecovery*.scala|\
                sql/core/src/test/scala/org/apache/spark/sql/execution/exchange/ShuffleRecovery*.scala)
                  source_identity=true
                  canonical_sql_identity=true
                  ;;
              esac
            done < <(git diff --name-only "${base}...HEAD")
          fi

          echo "source_identity=${source_identity}" >> "${GITHUB_OUTPUT}"
          echo "core_identity=${core_identity}" >> "${GITHUB_OUTPUT}"
          echo "canonical_sql_identity=${canonical_sql_identity}" >> "${GITHUB_OUTPUT}"
          echo "attempt_lifecycle=${attempt_lifecycle}" >> "${GITHUB_OUTPUT}"

  hygiene:
    name: Patch hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            spip/shuffle-recovery-experimental:refs/remotes/origin/spip/shuffle-recovery-experimental
          base="$(git merge-base HEAD origin/spip/shuffle-recovery-experimental)"
          git diff --check "${base}...HEAD"

  style:
    name: Scala style
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-experimental-style-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-experimental-style-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Run Scala style checks
        run: timeout --signal=TERM 20m ./dev/scalastyle "-Phadoop-3 -Phive"

  attempt-lifecycle:
    name: Attempt context, authorization and lifecycle boundary (Core, JDK 17)
    needs: scope
    if: needs.scope.outputs.attempt_lifecycle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-experimental-attempt-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-experimental-attempt-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile Core production and test code
        shell: bash
        run: |
          set -o pipefail
          ./build/sbt -Phadoop-3 "core/Test/compile" 2>&1 | \
            tee "${RUNNER_TEMP}/shuffle-recovery-attempt-core-compile.log"

      - name: Upload Core compile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuffle-recovery-attempt-core-compile-${{ github.run_id }}
          path: ${{ runner.temp }}/shuffle-recovery-attempt-core-compile.log
          if-no-files-found: error

      - name: Run attempt, authorization, lifecycle and adoption regressions
        run: |
          ./build/sbt -Phadoop-3 \
            "core/testOnly org.apache.spark.shuffle.ShuffleRecoveryAttemptContextSuite org.apache.spark.shuffle.ShuffleRecoveryAttemptContextHardeningSuite org.apache.spark.shuffle.ShuffleRecoverySchedulerAdoptionSuite org.apache.spark.shuffle.ShuffleRecoveryAdoptedFailureSuite org.apache.spark.shuffle.ReferenceShuffleProviderSuite"

      - name: Validate focused Core test discovery
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            ShuffleRecoveryAttemptContextSuite \
            ShuffleRecoveryAttemptContextHardeningSuite \
            ShuffleRecoverySchedulerAdoptionSuite \
            ShuffleRecoveryAdoptedFailureSuite \
            ReferenceShuffleProviderSuite; do
            report="$(find core -type f -path '*/test-reports/*' -name "*${suite}*.xml" -print -quit)"
            test -n "${report}"
          done

  source-identity:
    name: Source identity contract and cross-JVM proof (SQL, JDK 17)
    needs: scope
    if: needs.scope.outputs.source_identity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-experimental-source-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-experimental-source-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile SQL production and test code
        shell: bash
        run: |
          set -o pipefail
          ./build/sbt -Phadoop-3 -Phive "sql/Test/compile" 2>&1 | \
            tee "${RUNNER_TEMP}/shuffle-recovery-source-sql-compile.log"

      - name: Upload SQL compile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shuffle-recovery-source-sql-compile-${{ github.run_id }}
          path: ${{ runner.temp }}/shuffle-recovery-source-sql-compile.log
          if-no-files-found: error

      - name: Run source-token and resolved-value regressions
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoverySourceReadIdentitySuite"

      - name: Prove source token is stable across independent JVMs
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/shuffle-recovery-source-first.txt"
          second="${RUNNER_TEMP}/shuffle-recovery-source-second.txt"
          rm -f "${first}" "${second}"
          ./build/sbt -Phadoop-3 -Phive \
            "project sql" \
            "set Test / run / fork := true" \
            "Test/runMain org.apache.spark.sql.execution.exchange.ShuffleRecoverySourceReadIdentityProcess ${first}" \
            "Test/runMain org.apache.spark.sql.execution.exchange.ShuffleRecoverySourceReadIdentityProcess ${second}"
          test -s "${first}"
          test -s "${second}"
          cmp "${first}" "${second}"

      - name: Validate focused SQL test discovery
        shell: bash
        run: |
          set -euo pipefail
          report="$(find sql -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoverySourceReadIdentitySuite*.xml' -print -quit)"
          test -n "${report}"

  core-identity:
    name: Canonical identity codec and cross-JVM proof (Core, JDK 17)
    needs: scope
    if: needs.scope.outputs.core_identity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-experimental-core-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-experimental-core-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile Core production and test code
        run: ./build/sbt -Phadoop-3 "core/Test/compile"

      - name: Run identity codec, golden-vector, mutation and collision tests
        run: |
          ./build/sbt -Phadoop-3 \
            "core/testOnly org.apache.spark.shuffle.ShuffleRecoveryComputationIdentitySuite"

      - name: Prove canonical bytes are stable across independent JVMs
        shell: bash
        run: |
          set -euo pipefail
          vector="${RUNNER_TEMP}/shuffle-recovery-computation-identity.bin"
          rm -f "${vector}"
          ./build/sbt -Phadoop-3 \
            "project core" \
            "set Test / run / fork := true" \
            "Test/runMain org.apache.spark.shuffle.ShuffleRecoveryComputationIdentityProcess write ${vector}"
          ./build/sbt -Phadoop-3 \
            "project core" \
            "set Test / run / fork := true" \
            "Test/runMain org.apache.spark.shuffle.ShuffleRecoveryComputationIdentityProcess compare ${vector}"
          test -s "${vector}"

      - name: Validate focused Core test discovery
        shell: bash
        run: |
          set -euo pipefail
          report="$(find core -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryComputationIdentitySuite*.xml' -print -quit)"
          test -n "${report}"

  canonical-sql-identity:
    name: SQL materialization-boundary identity policy (JDK 17)
    needs: scope
    if: needs.scope.outputs.canonical_sql_identity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-experimental-sql-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-experimental-sql-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile SQL production and test code
        run: ./build/sbt -Phadoop-3 -Phive "sql/Test/compile"

      - name: Run identity boundary and eligibility regressions
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoveryComputationIdentityBuilderSuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryOpportunityAnalyzerSuite"

      - name: Validate focused SQL test discovery
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            ShuffleRecoveryComputationIdentityBuilderSuite \
            ShuffleRecoveryOpportunityAnalyzerSuite; do
            report="$(find sql -type f -path '*/test-reports/*' -name "*${suite}*.xml" -print -quit)"
            test -n "${report}"
          done
