name: Shuffle recovery experimental

on:
  pull_request:
    branches:
      - spip/shuffle-recovery-experimental
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuffle-recovery-experimental-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Patch hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            spip/shuffle-recovery-experimental:refs/remotes/origin/spip/shuffle-recovery-experimental
          base="$(git merge-base HEAD origin/spip/shuffle-recovery-experimental)"
          git diff --check "${base}...HEAD"

  style:
    name: Scala style
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-experimental-style-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-experimental-style-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Run Scala style checks
        run: timeout --signal=TERM 20m ./dev/scalastyle "-Phadoop-3 -Phive"

  core-identity:
    name: Canonical identity codec and cross-JVM proof (Core, JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-experimental-core-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-experimental-core-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile Core production and test code
        run: ./build/sbt -Phadoop-3 "core/Test/compile"

      - name: Run identity codec, golden-vector, mutation and collision tests
        run: |
          ./build/sbt -Phadoop-3 \
            "core/testOnly org.apache.spark.shuffle.ShuffleRecoveryComputationIdentitySuite"

      - name: Prove canonical bytes are stable across independent JVMs
        shell: bash
        run: |
          set -euo pipefail
          vector="${RUNNER_TEMP}/shuffle-recovery-computation-identity.bin"
          rm -f "${vector}"
          ./build/sbt -Phadoop-3 \
            "project core" \
            "set Test / run / fork := true" \
            "Test/runMain org.apache.spark.shuffle.ShuffleRecoveryComputationIdentityProcess write ${vector}"
          ./build/sbt -Phadoop-3 \
            "project core" \
            "set Test / run / fork := true" \
            "Test/runMain org.apache.spark.shuffle.ShuffleRecoveryComputationIdentityProcess compare ${vector}"
          test -s "${vector}"

      - name: Validate focused Core test discovery
        shell: bash
        run: |
          set -euo pipefail
          report="$(find core -type f -path '*/test-reports/*' \
            -name '*ShuffleRecoveryComputationIdentitySuite*.xml' -print -quit)"
          test -n "${report}"

  sql-identity:
    name: SQL materialization-boundary identity policy (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout requested head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: shuffle-recovery-experimental-sql-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-experimental-sql-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-

      - name: Compile SQL production and test code
        run: ./build/sbt -Phadoop-3 -Phive "sql/Test/compile"

      - name: Run identity boundary and eligibility regressions
        run: |
          ./build/sbt -Phadoop-3 -Phive \
            "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoveryComputationIdentityBuilderSuite org.apache.spark.sql.execution.exchange.ShuffleRecoveryOpportunityAnalyzerSuite"

      - name: Validate focused SQL test discovery
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            ShuffleRecoveryComputationIdentityBuilderSuite \
            ShuffleRecoveryOpportunityAnalyzerSuite; do
            report="$(find sql -type f -path '*/test-reports/*' -name "*${suite}*.xml" -print -quit)"
            test -n "${report}"
          done
