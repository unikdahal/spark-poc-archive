name: PR 43 targeted source-read validation

on:
  push:
    branches:
      - spip/p1-source-read-identity-targeted-ci

permissions:
  contents: read

jobs:
  source-read-identity:
    name: ShuffleRecoverySourceReadIdentitySuite (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR 43 head
        uses: actions/checkout@v6
        with:
          ref: e6a5efca82bde5764d1f51f4c514fec0afc80fc8
          fetch-depth: 0
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - name: Cache SBT and Maven launchers
        uses: actions/cache@v5
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
            ~/.cache/coursier
          key: pr43-targeted-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt', 'project/build.properties', 'build/sbt') }}
          restore-keys: |
            shuffle-recovery-sql-${{ runner.os }}-
            shuffle-recovery-build-${{ runner.os }}-
      - name: Compile SQL production and test code
        run: ./build/sbt -Phadoop-3 -Phive "sql/Test/compile"
      - name: Run source-read identity suite
        run: ./build/sbt -Phadoop-3 -Phive "sql/testOnly org.apache.spark.sql.execution.exchange.ShuffleRecoverySourceReadIdentitySuite"
